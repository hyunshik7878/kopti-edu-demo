<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>교육생 화면 — KOPTI 교육운영 자동화 체험</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--line:#ecdfc8;--ink:#2b2b2b;--soft:#6b6b6b;--muted:#9a938a;
  --accent:#d97706;--accent-soft:#fef3e2;--accent-ink:#7c5a12;--ok:#2f8f5b;--ok-soft:#e8f5ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
.bar{background:linear-gradient(90deg,#7c5a12,#a97c1b);color:#fff;font-size:12px;
  padding:8px 14px;text-align:center;line-height:1.5}
.bar b{font-weight:800}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:18px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(160,120,50,.06)}
h1{font-size:18px;margin:0 0 4px;color:var(--accent-ink);line-height:1.4}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 16px}
label{display:block;font-size:12.5px;color:var(--soft);margin:14px 0 5px;font-weight:600}
input,select,textarea{width:100%;font-family:inherit;font-size:15px;padding:10px 12px;
  border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:5px}
.btn{width:100%;margin-top:20px;padding:13px;font-size:15px;font-weight:700;
  background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:inherit;cursor:pointer}
.q{padding:14px 0;border-bottom:1px solid #f2ece2}
.q:last-of-type{border-bottom:none}
.q .t{font-size:14px;font-weight:600;margin-bottom:9px;line-height:1.55}
.opt{display:flex;align-items:center;gap:9px;padding:7px 2px;font-size:14px;color:var(--soft)}
.opt input{width:auto;flex:none}
.scale{display:flex;gap:6px;margin-top:8px}
.scale button{flex:1;padding:11px 0;font-size:14px;border:1px solid var(--line);
  background:#fff;border-radius:9px;font-family:inherit;cursor:pointer;color:var(--soft)}
.scale button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #f2ece2;font-size:14px}
.chk input{width:auto;flex:none;margin-top:4px}
canvas{width:100%;height:170px;border:1px dashed var(--line);border-radius:10px;background:#fff;touch-action:none}
.note{margin-top:16px;padding:12px 14px;background:var(--accent-soft);border-radius:10px;
  font-size:12px;color:var(--accent-ink);line-height:1.7}
.back{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--accent);text-decoration:none}
.mask{position:fixed;inset:0;background:rgba(40,30,15,.4);display:none;align-items:center;
  justify-content:center;padding:18px;z-index:20}
.mask.on{display:flex}
.pop{background:#fff;border-radius:14px;max-width:380px;width:100%;padding:20px 18px}
.pop h3{margin:0 0 10px;font-size:16px;color:var(--accent-ink)}
.pop p{margin:0 0 8px;font-size:13.5px;line-height:1.75}
.pop .why{margin-top:12px;padding:11px 13px;background:var(--ok-soft);border-left:3px solid var(--ok);
  border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.7}
.pop button{width:100%;margin-top:16px;padding:11px;border:none;border-radius:9px;
  background:var(--accent);color:#fff;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
</style>
</head><body>

<div class="bar"><b>체험용 샘플</b> — 교육생이 QR을 찍으면 보는 화면입니다. 제출되지 않습니다.</div>
<div class="wrap" id="w"></div>

<div class="mask" id="mask"><div class="pop" id="pop"></div></div>

<script>
var BASE = 'https://hyunshik7878.github.io/kopti-edu-demo/';
var K = (location.search.match(/[?&]k=([a-z]+)/) || [])[1] || 'apply';
var COURSE = '생성형 AI를 활용한 연구과제 기획 및 업무 프로세스 자동화 (2차)';

function pop(title, body, why){
  document.getElementById('pop').innerHTML =
    '<h3>'+title+'</h3>'+body+(why?'<div class="why"><b>담당자에게 좋은 점</b><br>'+why+'</div>':'')+
    '<button onclick="document.getElementById(\'mask\').classList.remove(\'on\')">닫기</button>';
  document.getElementById('mask').classList.add('on');
}

var VIEWS = {
  apply: {
    h:'수강신청', s:COURSE,
    body:
      '<label>성명</label><input placeholder="홍길동">'+
      '<label>휴대전화</label><input placeholder="010-0000-0000" inputmode="numeric">'+
      '<label>이메일</label><input placeholder="name@company.com" inputmode="email">'+
      '<label>소속 기업</label><input placeholder="(주)○○">'+
      '<label>주민등록번호 <span style="color:#b91c1c">*HRD-Net 등록용</span></label>'+
      '<input placeholder="●●●●●●-●●●●●●●" disabled>'+
      '<div class="hint">재직 확인이 끝나면 <b>즉시 파기</b>됩니다. 수료증에 필요한 생년월일만 따로 남습니다.</div>'+
      '<label>개인정보 수집·이용 동의</label>'+
      '<div class="opt"><input type="checkbox"> 수집·이용에 동의합니다 (필수)</div>'+
      '<div class="opt"><input type="checkbox"> 향후 교육 안내 수신에 동의합니다 (선택)</div>',
    btn:'신청하기',
    pt:'수강신청 접수',
    pb:'<p>실제로는 여기서 접수되어 담당자 화면의 <b>접수 목록</b>에 바로 나타납니다. '+
       '정원이 차 있으면 <b>대기</b>로 자동 전환되고, 앞사람이 취소하면 빈자리 안내가 자동으로 갑니다.</p>',
    pw:'신청서를 엑셀로 옮겨 적을 일이 없습니다. 정원 관리와 대기 순번이 자동입니다.'
  },
  pre: {
    h:'사전평가', s:COURSE+' · 교육 전 이해도 확인',
    body: quiz(),
    btn:'제출하기',
    pt:'사전평가 제출',
    pb:'<p>점수가 자동 채점되어 명단에 붙습니다. 교육이 끝난 뒤 사후평가 점수와 대조해 '+
       '<b>개인별 향상도</b>가 계산됩니다.</p>',
    pw:'채점과 집계를 사람이 하지 않습니다. 향상도는 성과 보고에 그대로 쓸 수 있습니다.'
  },
  post: {
    h:'사후평가', s:COURSE+' · 교육 후 이해도 확인',
    body: quiz(),
    btn:'제출하기',
    pt:'사후평가 제출',
    pb:'<p>사전 점수와 자동으로 짝지어져 향상도가 나오고, 틀린 문항의 <b>영역</b>을 모아 '+
       '개인별 역량분석 리포트가 만들어집니다.</p>',
    pw:'수료증 메일에 개인별 학습 조언이 함께 나갑니다. 담당자가 쓰지 않아도 됩니다.'
  },
  sat: {
    h:'만족도 조사', s:COURSE,
    body:
      scale('교육 내용이 업무에 도움이 되었습니까?')+
      scale('강사의 전달력은 어떠했습니까?')+
      scale('교육 환경(장소·기자재)에 만족하십니까?')+
      scale('다른 분께 이 과정을 추천하시겠습니까?')+
      '<label>개선했으면 하는 점 (선택)</label><textarea rows="3" placeholder="자유롭게 적어 주세요"></textarea>',
    btn:'제출하기',
    pt:'만족도 제출',
    pb:'<p>과정별 평균이 자동 집계되어 통계 화면과 연간 실적에 반영됩니다.</p>',
    pw:'설문지를 걷어 집계표를 만들 일이 없습니다. 제출 즉시 숫자가 갱신됩니다.'
  },
  sign: {
    h:'교재 수령 확인', s:COURSE+' · 오리엔테이션',
    body:
      '<div class="chk"><input type="checkbox"><div>교재를 수령하였습니다.</div></div>'+
      '<div class="chk"><input type="checkbox"><div>중식이 제공됨을 안내받았습니다.</div></div>'+
      '<div class="chk"><input type="checkbox"><div>교육장 안전수칙을 안내받았습니다.</div></div>'+
      '<label style="margin-top:18px">서명</label>'+
      '<canvas id="pad"></canvas>'+
      '<div class="hint">손가락으로 서명하세요. <button type="button" id="clr" '+
      'style="border:none;background:none;color:var(--accent);font-size:11.5px;padding:0;cursor:pointer;font-family:inherit">지우기</button></div>',
    btn:'서명 제출',
    pt:'전자서명 접수',
    pb:'<p>서명 이미지가 드라이브에 저장되고, 담당자 화면의 <b>서명 현황</b>이 즉시 초록으로 바뀝니다. '+
       '과정이 끝나면 전원 서명이 담긴 <b>서명 대장 PDF</b>가 한 번에 만들어집니다.</p>',
    pw:'종이 서명부를 돌리고, 걷고, 스캔해서 보관하는 일이 통째로 사라집니다.'
  }
};

function quiz(){
  var qs = [
    ['생성형 AI에게 같은 품질의 결과를 반복해서 얻으려면 무엇이 가장 중요한가?',
     ['질문을 짧게 쓴다','역할·맥락·형식을 나누어 지시한다','매번 다른 표현을 쓴다','한 번에 여러 질문을 넣는다']],
    ['생성된 결과를 업무에 쓰기 전 반드시 확인해야 하는 것은?',
     ['글자 수','문단 나누기','숫자·인용·고유명사','제목 길이']],
    ['업무 자동화를 설계할 때 가장 먼저 할 일은?',
     ['도구부터 고른다','반복되는 일을 찾아 단계로 쪼갠다','예산을 정한다','보고서를 쓴다']]
  ];
  return qs.map(function(q,i){
    return '<div class="q"><div class="t">'+(i+1)+'. '+q[0]+'</div>'+
      q[1].map(function(o){
        return '<label class="opt"><input type="radio" name="q'+i+'"> '+o+'</label>';
      }).join('')+'</div>';
  }).join('');
}
function scale(t){
  return '<div class="q"><div class="t">'+t+'</div><div class="scale">'+
    [1,2,3,4,5].map(function(n){
      return '<button type="button" onclick="pick(this)">'+n+'</button>';
    }).join('')+'</div></div>';
}
function pick(b){
  var p=b.parentNode;
  for(var i=0;i<p.children.length;i++) p.children[i].className='';
  b.className='on';
}

var v = VIEWS[K] || VIEWS.apply;
document.getElementById('w').innerHTML =
  '<div class="card"><h1>'+v.h+'</h1><p class="sub">'+v.s+'</p>'+v.body+
  '<button class="btn" id="go">'+v.btn+'</button>'+
  '<div class="note">이 화면은 교육생이 QR을 찍으면 보는 실제 화면입니다. '+
  '체험판이라 제출되지 않습니다.</div></div>'+
  '<a class="back" href="'+BASE+'">← 담당자 관제 화면으로 돌아가기</a>';

document.getElementById('go').onclick = function(){ pop(v.pt, v.pb, v.pw); };

/* 서명 패드 */
if(K==='sign'){
  var c=document.getElementById('pad'), x=c.getContext('2d'), drawing=false;
  function fit(){ var r=c.getBoundingClientRect(); c.width=r.width*2; c.height=r.height*2;
    x.scale(2,2); x.lineWidth=2.2; x.lineCap='round'; x.strokeStyle='#2b2b2b'; }
  fit(); window.addEventListener('resize', fit);
  function pt(e){ var r=c.getBoundingClientRect(); var t=e.touches?e.touches[0]:e;
    return {x:t.clientX-r.left, y:t.clientY-r.top}; }
  function down(e){ drawing=true; var p=pt(e); x.beginPath(); x.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; var p=pt(e); x.lineTo(p.x,p.y); x.stroke(); e.preventDefault(); }
  function up(){ drawing=false; }
  c.addEventListener('mousedown',down); c.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
  c.addEventListener('touchstart',down,{passive:false});
  c.addEventListener('touchmove',move,{passive:false});
  c.addEventListener('touchend',up);
  document.getElementById('clr').onclick=function(){ x.clearRect(0,0,c.width,c.height); };
}
</script>
</body></html>
